name: Validar alertas de evidencia

on:
  pull_request:
    paths:
      - "weekly-alerts.js"
      - "weekly-alerts-professional.js"
      - "weekly-alerts.json"
      - "index.html"
      - "supabase/functions/evidence-content/index.ts"
      - ".github/workflows/validate-alerts.yml"
  push:
    branches:
      - main
    paths:
      - "weekly-alerts.js"
      - "weekly-alerts-professional.js"
      - "weekly-alerts.json"
      - "index.html"
      - "supabase/functions/evidence-content/index.ts"
      - ".github/workflows/validate-alerts.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar sintaxis JavaScript
        run: |
          node --check weekly-alerts.js
          node --check weekly-alerts-professional.js

      - name: Confirmar que el archivo estático no contiene evidencia premium
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('weekly-alerts.json', 'utf8'));
          if (data.contentClassification !== 'protected-server-delivery') {
            throw new Error('weekly-alerts.json debe ser solo un marcador de contenido protegido.');
          }
          if (!Array.isArray(data.items) || data.items.length !== 0) {
            throw new Error('El archivo estático no puede contener fichas completas de evidencia.');
          }
          if (!Array.isArray(data.watchlist) || data.watchlist.length !== 0) {
            throw new Error('La vigilancia detallada tampoco debe publicarse como activo estático.');
          }
          console.log('Activo público saneado: sin contenido premium.');
          NODE

      - name: Confirmar entrega protegida desde Supabase
        run: |
          grep -q 'functions/v1' weekly-alerts.js
          grep -q 'weeklyEvidence' weekly-alerts.js
          if grep -q 'weekly-alerts.json' weekly-alerts.js; then
            echo 'weekly-alerts.js todavía intenta cargar el JSON público' >&2
            exit 1
          fi
          grep -q 'evidence_weekly_alerts' supabase/functions/evidence-content/index.ts
          grep -q 'Cache-Control' supabase/functions/evidence-content/index.ts
          grep -q 'private, no-store' supabase/functions/evidence-content/index.ts

      - name: Confirmar integración y contraste en la interfaz
        run: |
          grep -q 'weekly-alerts.js' index.html
          grep -q 'weekly-alerts-professional.js' index.html
          grep -q 'weekly-card .weekly-card-top h2' weekly-alerts-professional.js
          grep -q 'color: #ffffff !important' weekly-alerts-professional.js
          grep -q -- '-webkit-text-fill-color: #ffffff' weekly-alerts-professional.js
          grep -q 'MutationObserver' weekly-alerts-professional.js
          grep -q 'weekly-implication p' weekly-alerts-professional.js
          grep -q 'weekly-reference' weekly-alerts-professional.js
