name: Validar alertas de evidencia

on:
  pull_request:
    paths:
      - "weekly-alerts.js"
      - "weekly-alerts-professional.js"
      - "weekly-alerts.json"
      - "index.html"
      - ".github/workflows/validate-alerts.yml"
  push:
    branches:
      - main
    paths:
      - "weekly-alerts.js"
      - "weekly-alerts-professional.js"
      - "weekly-alerts.json"
      - "index.html"
      - ".github/workflows/validate-alerts.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar sintaxis JavaScript
        run: |
          node --check weekly-alerts.js
          node --check weekly-alerts-professional.js

      - name: Validar estructura y clasificación editorial
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('weekly-alerts.json', 'utf8'));
          const required = [
            'id', 'alertDate', 'source', 'status', 'title', 'citation',
            'studyType', 'population', 'mainFinding', 'quality',
            'clinicalImplication', 'teachingImplication', 'url'
          ];
          if (data.contentClassification !== 'public-evidence-digest') {
            throw new Error('La clasificación editorial del archivo no es válida.');
          }
          if (!String(data.editorialNote || '').includes('No contiene datos de usuarios')) {
            throw new Error('Falta la declaración explícita de protección de datos.');
          }
          if (!Array.isArray(data.items) || data.items.length === 0) {
            throw new Error('La lista de alertas está vacía.');
          }
          const forbiddenFields = new Set([
            'email', 'user_id', 'userId', 'password', 'access_token',
            'refresh_token', 'transaction_id', 'license_key', 'clinical_record'
          ]);
          const ids = new Set();
          for (const item of data.items) {
            for (const field of required) {
              if (!String(item[field] || '').trim()) {
                throw new Error(`Falta ${field} en ${item.id || 'registro sin id'}.`);
              }
            }
            for (const field of Object.keys(item)) {
              if (forbiddenFields.has(field)) {
                throw new Error(`Campo sensible no permitido en ${item.id}: ${field}`);
              }
            }
            if (ids.has(item.id)) throw new Error(`ID duplicado: ${item.id}`);
            ids.add(item.id);
            const url = new URL(item.url);
            if (url.protocol !== 'https:') throw new Error(`URL insegura: ${item.url}`);
          }
          if (!Array.isArray(data.watchlist)) {
            throw new Error('watchlist debe ser una lista.');
          }
          console.log(`Alertas verificadas y clasificadas: ${data.items.length}`);
          NODE

      - name: Confirmar integración en la interfaz
        run: |
          grep -q 'weekly-alerts.js' index.html
          grep -q 'weekly-alerts-professional.js' index.html
          grep -q '.weekly-card h2' weekly-alerts-professional.js
          grep -q 'color: #ffffff !important' weekly-alerts-professional.js
          grep -q '.weekly-implication p' weekly-alerts-professional.js
          grep -q '.weekly-reference' weekly-alerts-professional.js
